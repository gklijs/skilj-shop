[package]
name = "skilj-shop"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "A GraphQL talk demo: a reseller and finance see different views of the same order."

[dependencies]
skilj = { version = "=0.4.0", features = ["local"] }
skilj-core = "=0.4.0"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
http-body-util = "0.1"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
rsa = "0.9"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
